name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps (icon outlining)
        run: python -m pip install shapely svgelements

      - name: Install Node deps
        run: npm ci

      - name: Lint SCSS
        run: npm run lint

      - name: Build all artifacts
        run: npm run build

      - name: Smoke test
        run: node test/smoke.test.mjs

      - name: Build docs site
        run: npx vite build
